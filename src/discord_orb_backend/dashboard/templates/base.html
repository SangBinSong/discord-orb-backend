<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Discord Orb Operator Dashboard{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --ok-bg: #dcfce7;
      --ok-text: #166534;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --err-bg: #fee2e2;
      --err-text: #991b1b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --ok-bg: #14532d;
        --ok-text: #bbf7d0;
        --warn-bg: #78350f;
        --warn-text: #fde68a;
        --err-bg: #7f1d1d;
        --err-text: #fecaca;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header.topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.5rem; margin: 0; }
    h2 { font-size: 1.125rem; margin: 0 0 0.75rem 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .banner {
      padding: 0.875rem 1rem;
      border-radius: 0.5rem;
      font-weight: 500;
    }
    .banner-warn { background: var(--warn-bg); color: var(--warn-text); }
    .banner-err { background: var(--err-bg); color: var(--err-text); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
    .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
    .badge-err { background: var(--err-bg); color: var(--err-text); }
    table { width: 100%; border-collapse: collapse; font-size: 0.925rem; }
    th, td {
      text-align: left;
      padding: 0.625rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th { font-weight: 600; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0.9rem;
      border-radius: 0.5rem;
      border: 1px solid transparent;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #ffffff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
  </style>
</head>
<body>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
